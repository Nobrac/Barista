name: build
on: [push, pull_request]

jobs:
  wizard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The two tools are PowerShell, so nothing in the C# build would ever
      # notice a syntax error in them. The first person to find out would be
      # someone running bootstrap.bat on a fresh VM at the point where it goes
      # to get Doppio, or someone packing a bundle for a friend. Parsing them
      # here is cheap.
      - name: Check the PowerShell tools parse
        shell: pwsh
        run: |
          $bad = $false
          foreach ($file in Get-ChildItem tools/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref] $null, [ref] $errors) | Out-Null
            if ($errors) {
              $bad = $true
              $errors | ForEach-Object {
                Write-Host "::error file=$($file.Name),line=$($_.Extent.StartLineNumber)::$($_.Message)"
              }
            } else {
              Write-Host "$($file.Name) parses clean"
            }
          }
          if ($bad) { exit 1 }

      # Only the wizard is built here. Doppio and Ristretto need MSVC and are
      # built by their own repositories; bootstrap.bat is what joins the three
      # on a real machine, and there is nothing useful to assert about it in CI.
      - name: Build
        run: dotnet build src/Barista.csproj -c Release

      # The stage plan and the stage runner are where a mistake locks someone
      # out of a VM, so they are a library with tests rather than a WPF
      # code-behind. This is the step that makes the ordering rules in
      # InstallPlan's comments fail a build instead of being re-read.
      - name: Test
        run: dotnet test tests/Barista.Core.Tests/Barista.Core.Tests.csproj -c Release --nologo

      - name: Publish
        run: >
          dotnet publish src/Barista.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o wizard-out

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: barista
          path: wizard-out/Barista.exe

  # The pinned fetch without git, against the real GitHub. bootstrap.bat takes
  # this path on a machine with no git and /nodeps, and it cannot be exercised
  # anywhere git is on the PATH - so git is taken off it here.
  pinned-fetch-without-git:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Doppio and Ristretto at the pins, as zips
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          if (Get-Command git -ErrorAction SilentlyContinue) { throw "git is still on the PATH" }

          $lock = Get-Content payload.lock.json -Raw | ConvertFrom-Json
          $work = Join-Path $env:RUNNER_TEMP 'fetch'
          foreach ($r in @(@('Doppio', 'build.bat'), @('Ristretto', 'build-ristretto.bat'))) {
            ./tools/fetch-from-github.ps1 -Owner Nobrac -Repo $r[0] -Dest (Join-Path $work $r[0]) `
              -Marker $r[1] -LockFile payload.lock.json -LockKey $r[0]
            if ($LASTEXITCODE -ne 0) { throw "$($r[0]) could not be fetched at the pin (exit $LASTEXITCODE)" }
          }

          # A hashtable, not nested @() arrays: PowerShell flattens those.
          $checks = [ordered]@{
            "$work/Doppio/.barista-pin"                  = $lock.doppio.commit
            "$work/Ristretto/.barista-pin"               = $lock.ristretto.commit
            "$work/Ristretto/extern/doppio/.barista-pin" = $lock.ristretto.doppioSubmodule.commit
          }
          foreach ($file in $checks.Keys) {
            $want = $checks[$file]
            $got = (Get-Content $file -Raw).Trim()
            if ($got -ne $want) { throw "$file says $got, expected $want" }
            Write-Host "ok  $want  $file"
          }
          if (-not (Test-Path "$work/Ristretto/extern/doppio/verify.cpp")) { throw "Ristretto's Doppio submodule is empty" }

          # Run again: an existing folder at the pin is accepted as it is.
          ./tools/fetch-from-github.ps1 -Owner Nobrac -Repo Ristretto -Dest "$work/Ristretto" `
            -Marker build-ristretto.bat -LockFile payload.lock.json -LockKey ristretto
          if ($LASTEXITCODE -ne 0) { throw "second run did not accept the pinned folder" }
